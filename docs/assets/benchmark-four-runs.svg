<svg xmlns="http://www.w3.org/2000/svg" width="600" height="520" viewBox="0 0 600 520" role="img" aria-labelledby="title desc">
  <title id="title">Four-run token usage: root Astra within the complete workflow</title>
  <desc id="desc">All bars share a zero to 200 million token scale. Filled portions are root Astra tokens, included in the outlined whole-workflow totals. Old: 59.47M of 150.35M. Cheap: 1.05M of 118.84M. Balanced: 2.12M of 68.94M. Luna 6: 7.40M of 186.87M. Maintainer-supplied exports include cached input. These are not billing, speed or quality scores; raw-log audit is pending.</desc>
  <rect width="600" height="520" rx="12" fill="white"/>
  <g font-family="sans-serif" fill="black">
    <text x="32" y="38" font-size="24" font-weight="700">Root activity is not the whole workflow</text>
    <text x="32" y="65" font-size="17">Reported tokens, including cached input</text>
    <rect x="32" y="83" width="16" height="12"/>
    <text x="56" y="95" font-size="16">Root Astra</text>
    <rect x="190" y="83" width="16" height="12" fill="none" stroke="black"/>
    <text x="214" y="95" font-size="16">Whole workflow (includes root)</text>
    <g data-run="Old" data-root-millions="59.47" data-total-millions="150.35">
      <text x="32" y="130" font-size="20" font-weight="700">Old</text>
      <text x="568" y="130" text-anchor="end" font-size="17">Root 59.47M / total 150.35M</text>
      <rect x="32" y="144" width="402.9380" height="19" fill="none" stroke="black" stroke-width="1.3"/>
      <rect x="32" y="144" width="159.3796" height="19"/>
    </g>
    <g data-run="Cheap" data-root-millions="1.05" data-total-millions="118.84">
      <text x="32" y="207" font-size="20" font-weight="700">Cheap</text>
      <text x="568" y="207" text-anchor="end" font-size="17">Root 1.05M / total 118.84M</text>
      <rect x="32" y="221" width="318.4912" height="19" fill="none" stroke="black" stroke-width="1.3"/>
      <rect x="32" y="221" width="2.8140" height="19"/>
    </g>
    <g data-run="Balanced" data-root-millions="2.12" data-total-millions="68.94">
      <text x="32" y="284" font-size="20" font-weight="700">Balanced</text>
      <text x="568" y="284" text-anchor="end" font-size="17">Root 2.12M / total 68.94M</text>
      <rect x="32" y="298" width="184.7592" height="19" fill="none" stroke="black" stroke-width="1.3"/>
      <rect x="32" y="298" width="5.6816" height="19"/>
    </g>
    <g data-run="Luna 6" data-root-millions="7.40" data-total-millions="186.87">
      <text x="32" y="361" font-size="20" font-weight="700">Luna 6</text>
      <text x="568" y="361" text-anchor="end" font-size="17">Root 7.40M / total 186.87M</text>
      <rect x="32" y="375" width="500.8116" height="19" fill="none" stroke="black" stroke-width="1.3"/>
      <rect x="32" y="375" width="19.8320" height="19"/>
    </g>
    <path d="M32 418 H568" fill="none" stroke="black"/>
    <path d="M32 418 v6" stroke="black"/>
    <text x="32" y="445" text-anchor="start" font-size="16">0M</text>
    <path d="M166 418 v6" stroke="black"/>
    <text x="166" y="445" text-anchor="middle" font-size="16">50M</text>
    <path d="M300 418 v6" stroke="black"/>
    <text x="300" y="445" text-anchor="middle" font-size="16">100M</text>
    <path d="M434 418 v6" stroke="black"/>
    <text x="434" y="445" text-anchor="middle" font-size="16">150M</text>
    <path d="M568 418 v6" stroke="black"/>
    <text x="568" y="445" text-anchor="end" font-size="16">200M</text>
    <text x="32" y="480" font-size="16">Session exports, not verified costs or quality scores.</text>
    <text x="32" y="503" font-size="16">Raw-log audit and Luna 6 comparative review pending.</text>
  </g>
</svg>
